<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisador de Preços da Cesta Básica</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header>
    <h1>Analisador de Preços</h1>
    <p>Comparação de preços da cesta básica</p>
  </header>

  <main>
    <h2>Informe os preços dos produtos</h2>

    <form id="formulario">
      <div class="produto">
        <h3>Produto 1</h3>
        <label for="nome1">Nome:</label>
        <input id="nome1" required placeholder="Ex.: Arroz">

        <label for="anterior1">Preço anterior (R$):</label>
        <input id="anterior1" type="number" min="0" step="0.01" required>

        <label for="atual1">Preço atual (R$):</label>
        <input id="atual1" type="number" min="0" step="0.01" required>
      </div>

      <div class="produto">
        <h3>Produto 2</h3>
        <label for="nome2">Nome:</label>
        <input id="nome2" required placeholder="Ex.: Feijão">

        <label for="anterior2">Preço anterior (R$):</label>
        <input id="anterior2" type="number" min="0" step="0.01" required>

        <label for="atual2">Preço atual (R$):</label>
        <input id="atual2" type="number" min="0" step="0.01" required>
      </div>

      <div class="produto">
        <h3>Produto 3</h3>
        <label for="nome3">Nome:</label>
        <input id="nome3" required placeholder="Ex.: Óleo">

        <label for="anterior3">Preço anterior (R$):</label>
        <input id="anterior3" type="number" min="0" step="0.01" required>

        <label for="atual3">Preço atual (R$):</label>
        <input id="atual3" type="number" min="0" step="0.01" required>
      </div>

      <button type="submit">Analisar preços</button>
    </form>

    <section id="resultados" aria-live="polite">
      <h2>Resultados da análise</h2>
      <div id="lista-resultados"></div>
    </section>
  </main>

  <footer>
    <p>Projeto educacional de Análise e Desenvolvimento de Sistemas</p>
  </footer>
</body>
</html>
